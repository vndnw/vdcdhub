<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Lens Gradient -->
    <radialGradient id="bgGrad" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#242424" />
      <stop offset="100%" stop-color="#0f0f0f" />
    </radialGradient>

    <!-- Clock Face Gradient -->
    <linearGradient id="clockGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE047" />
      <stop offset="45%" stop-color="#FACC15" />
      <stop offset="100%" stop-color="#F59E0B" />
    </linearGradient>

    <!-- Badge Gradient -->
    <linearGradient id="badgeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22C55E" />
      <stop offset="100%" stop-color="#16A34A" />
    </linearGradient>

    <!-- Shadow -->
    <filter id="badgeShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="2" dy="6" stdDeviation="5" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Base Rounded Charcoal Frame -->
  <rect x="16" y="16" width="480" height="480" rx="108" fill="url(#bgGrad)" stroke="#262626" stroke-width="6" />

  <!-- Inner Camera Viewfinder Aperture Ring -->
  <circle cx="256" cy="256" r="195" fill="none" stroke="#222222" stroke-width="4" stroke-dasharray="8 8" />

  <!-- Signature Timemark Camera Corner Brackets (Thick Amber Yellow) -->
  <g stroke="#FACC15" stroke-width="18" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <!-- Top-Left -->
    <path d="M 64,136 L 64,88 Q 64,64 88,64 L 136,64" />
    <!-- Top-Right -->
    <path d="M 376,64 L 424,64 Q 448,64 448,88 L 448,136" />
    <!-- Bottom-Left -->
    <path d="M 64,376 L 64,424 Q 64,448 88,448 L 136,448" />
    <!-- Bottom-Right -->
    <path d="M 376,448 L 424,448 Q 448,448 448,424 L 448,376" />
  </g>

  <!-- Central Camera Lens / Yellow Clock Face -->
  <circle cx="256" cy="256" r="142" fill="url(#clockGrad)" stroke="#78350F" stroke-width="8" />
  <!-- Inner Ring Accent -->
  <circle cx="256" cy="256" r="130" fill="none" stroke="#FDE047" stroke-width="3" opacity="0.8" />

  <!-- 12, 3, 6, 9 Clock Ticks -->
  <rect x="251" y="132" width="10" height="18" rx="5" fill="#78350F" />
  <rect x="368" y="251" width="18" height="10" rx="5" fill="#78350F" />
  <rect x="251" y="362" width="10" height="18" rx="5" fill="#78350F" />
  <rect x="126" y="251" width="18" height="10" rx="5" fill="#78350F" />

  <!-- Cute Cheek Blushes -->
  <ellipse cx="185" cy="258" rx="16" ry="10" fill="#EF4444" opacity="0.35" />
  <ellipse cx="327" cy="258" rx="16" ry="10" fill="#EF4444" opacity="0.35" />

  <!-- Left Eye: Cheeky Wink (Arc) -->
  <path d="M 190,214 Q 212,192 234,214" stroke="#18181B" stroke-width="11" stroke-linecap="round" fill="none" />

  <!-- Right Eye: Wide Sly Eye (Cartoon Glare Looking Sideways) -->
  <ellipse cx="298" cy="208" rx="18" ry="20" fill="#FFFFFF" stroke="#18181B" stroke-width="6" />
  <circle cx="303" cy="208" r="10" fill="#18181B" />
  <circle cx="306" cy="204" r="3.5" fill="#FFFFFF" />

  <!-- Clock Hands (Forming Playful Gestures / Nose) -->
  <line x1="256" y1="256" x2="198" y2="238" stroke="#18181B" stroke-width="11" stroke-linecap="round" />
  <line x1="256" y1="256" x2="310" y2="248" stroke="#18181B" stroke-width="9" stroke-linecap="round" />
  <!-- Center Pivot Pin -->
  <circle cx="256" cy="256" r="11" fill="#18181B" stroke="#FACC15" stroke-width="2" />

  <!-- Cheeky Smirk Grin Mouth (Sly Smile with Right Cheek Upturn) -->
  <path d="M 216,288 Q 256,334 296,294 Q 306,282 312,274" stroke="#18181B" stroke-width="11" stroke-linecap="round" fill="none" />
  <!-- Mouth Dimple Accent -->
  <path d="M 314,270 Q 320,276 322,284" stroke="#18181B" stroke-width="7" stroke-linecap="round" fill="none" />

  <!-- Crooked Satirical "100% REAL" Verification Badge (Tilted Top-Right) -->
  <g transform="translate(362, 138) rotate(13)" filter="url(#badgeShadow)">
    <!-- Badge Background Pill -->
    <rect x="-82" y="-23" width="164" height="46" rx="14" fill="url(#badgeGrad)" stroke="#FFFFFF" stroke-width="3.5" />
    <!-- White Checkmark Circle -->
    <circle cx="-54" cy="0" r="13" fill="#FFFFFF" />
    <path d="M -60,0 L -56,4 L -48,-4" stroke="#16A34A" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" fill="none" />
    <!-- Text "100% REAL" -->
    <text x="-34" y="7" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="20" fill="#FFFFFF" letter-spacing="0.5">100% REAL</text>
  </g>
</svg>
